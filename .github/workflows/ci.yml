name: CI

# Runs on every push, so test results are visible from a phone in the
# repository's Actions tab. There is no local dev environment on this project.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Run tests
        # Includes the eleven calculator tests from SPEC.md 5.9 and the RLS
        # checks, which run the real schema.sql against Postgres in WebAssembly.
        run: npm test

      - name: Build
        run: npm run build
